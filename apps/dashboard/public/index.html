<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <div class="brand-logo">JM</div>
      <div class="brand-name">Job Mission Control</div>
    </div>
    <nav class="nav">
      <button class="nav-tab active" data-view="dashboard">Dashboard</button>
      <button class="nav-tab" data-view="followups">Follow-ups <span class="nav-badge hidden" id="fu-badge"></span></button>
      <button class="nav-tab" data-view="templates">Templates</button>
    </nav>
    <div class="spacer"></div>
    <span class="conn-chip" id="conn"><span class="conn-dot off"></span> Not connected</span>
    <div class="privacy">
      <svg width="11" height="13" viewBox="0 0 11 13" fill="none" aria-hidden="true"><path d="M2.5 5.5V3.6a3 3 0 0 1 6 0v1.9" stroke="#1F6B4E" stroke-width="1.4" fill="none"></path><rect x="1" y="5.5" width="9" height="6.5" rx="2" fill="#1F6B4E"></rect></svg>
      <span>Drafts only · nothing sends</span>
    </div>
    <button class="btn btn-primary" id="log-btn">Log application</button>
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
    </button>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main id="view-dashboard" class="view"></main>
  <main id="view-followups" class="view view-narrow hidden"></main>
  <main id="view-templates" class="view hidden"></main>
  <main id="view-settings" class="view hidden"></main>
  <div id="view-report" class="hidden"></div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="tip-root"></div>

  <script src="/app.js"></script>
</body>
</html>
